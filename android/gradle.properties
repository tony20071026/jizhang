org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# 关闭 Kotlin 增量编译：pub cache 在 C 盘、工程在 D 盘，Kotlin 的
# RelocatableFileToPathConverter 无法把绝对路径相对化，会导致
# 「this and base files have different roots」→ compileReleaseKotlin 失败。
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
# Flutter 模板写入的 android.newDsl=false / android.builtInKotlin=false 已被 AGP 9 弃用，
# 且会导致 SDK 组件 provider 无值（compileReleaseJavaWithJavac 失败），此处恢复 AGP 默认值。
# 必须为 false：Flutter 3.47 的 Gradle 插件仍在使用旧 DSL 接口，AGP 9 的 newDsl 会使其崩溃。
android.newDsl=false
android.builtInKotlin=true
